plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.13'       // antes: 3.3.0
    id 'io.spring.dependency-management' version '1.1.7' // antes: 1.1.4
    id 'jacoco'
}

group = 'co.edu.unimagdalena'
version = '0.0.1-SNAPSHOT'
description = 'storeLogistic'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', '2024.0.1')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'   // WebClient
    implementation 'org.springframework.boot:spring-boot-starter-aop'       // required by Spring Retry
    implementation 'org.springframework.retry:spring-retry'

    // Messaging — Spring Cloud Stream + RabbitMQ
    implementation 'org.springframework.cloud:spring-cloud-starter-stream-rabbit'

    // Database & Migrations
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core:11.20.3'                        // antes: 10.4.1
    implementation 'org.flywaydb:flyway-database-postgresql:11.20.3'         // ⚠️ NUEVO - requerido para PostgreSQL 17

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'                           // antes: 1.5.5.Final

    // Lombok (debe declararse antes de MapStruct en annotationProcessor)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // Development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'              // antes: 5.9.3
    testImplementation 'org.mockito:mockito-core:5.16.1'                     // antes: 5.3.1
    testImplementation 'org.mockito:mockito-junit-jupiter:5.16.1'
    testImplementation 'org.assertj:assertj-core:3.27.3'                     // antes: 3.24.1
    testImplementation 'org.testcontainers:testcontainers:1.20.6'            // antes: 1.19.1
    testImplementation 'org.testcontainers:postgresql:1.20.6'
    testImplementation 'org.testcontainers:rabbitmq:1.20.6'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.6'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.0'          // antes: 1.3.0
    testImplementation 'org.wiremock:wiremock-standalone:3.13.0'
    testImplementation 'io.rest-assured:rest-assured:5.4.0'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // OpenAPI / Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5' // antes: 2.1.0
}

tasks.named('test') {
    useJUnitPlatform()
}